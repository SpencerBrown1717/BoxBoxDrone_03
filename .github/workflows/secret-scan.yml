name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Scan git history for secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run pinned Gitleaks with redacted output
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scan_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          if ! "$scan_dir/gitleaks" git --redact=100 --no-banner . >"$scan_dir/scan.log" 2>&1; then
            echo "::error::Secret scan failed. Inspect locally with Gitleaks in redacted mode."
            exit 1
          fi
